  <rect x="320" y="280" width="230" height="120" rx="14" fill="#222c31"/>
  <rect x="590" y="280" width="230" height="120" rx="14" fill="#222c31"/>
  <text x="344" y="330" font-family="Segoe UI, sans-serif" font-size="16" fill="#7eb89f">Water 1.8 / 2.7 L</text>
  <text x="614" y="330" font-family="Segoe UI, sans-serif" font-size="16" fill="#d4a35c">Sleep 7.5 hrs</text>
  <rect x="320" y="430" width="500" height="100" rx="14" fill="#222c31"/>
  <text x="344" y="488" font-family="Segoe UI, sans-serif" font-size="16" fill="#9bb0a6">Journal entry…</text>
