<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="HeadSynk app interface preview">
  <rect width="960" height="640" fill="#12181a"/>
  <rect x="70" y="50" width="820" height="540" rx="22" fill="#1b2428" stroke="#2c3a40"/>
  <!-- sidebar -->
  <rect x="70" y="50" width="210" height="540" rx="22" fill="#151c1f"/>
  <rect x="250" y="50" width="30" height="540" fill="#151c1f"/>
  <text x="100" y="110" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#e8f0ea">HeadSynk</text>
  <g font-family="Segoe UI, sans-serif" font-size="15" fill="#9bb0a6">
    <text x="100" y="170">Mood</text>
    <text x="100" y="210">Food</text>
    <text x="100" y="250">Water</text>
    <text x="100" y="290">Sleep</text>
