<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Color Theory App preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f4ef"/>
      <stop offset="100%" stop-color="#e4ebe7"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <!-- app chrome -->
  <rect x="48" y="56" width="864" height="528" rx="18" fill="#fff" stroke="#d7ddd8"/>
  <rect x="48" y="56" width="864" height="64" rx="18" fill="#f3f6f4"/>
  <rect x="48" y="100" width="864" height="20" fill="#f3f6f4"/>
  <!-- nav -->
  <text x="76" y="98" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#1d2a24">Color Theory</text>
  <g font-family="Segoe UI, sans-serif" font-size="15" fill="#5f7268">
    <text x="280" y="98">Home</text>
    <text x="360" y="98">Color Wheel</text>
    <text x="480" y="98">Upload</text>
    <text x="560" y="98">Sandbox</text>
    <text x="660" y="98">Accessibility</text>
  </g>
  <rect x="276" y="108" width="42" height="3" rx="1.5" fill="#d4a35c"/>
  <!-- color wheel -->
  <g transform="translate(280 360)">
    <circle r="150" fill="#fff" stroke="#e2e8e4"/>
    <g>
      <path d="M0,0 L0,-140 A140,140 0 0,1 121.2,-70 Z" fill="#e74c3c"/>
      <path d="M0,0 L121.2,-70 A140,140 0 0,1 121.2,70 Z" fill="#f39c12"/>
      <path d="M0,0 L121.2,70 A140,140 0 0,1 0,140 Z" fill="#f1c40f"/>
      <path d="M0,0 L0,140 A140,140 0 0,1 -121.2,70 Z" fill="#2ecc71"/>
      <path d="M0,0 L-121.2,70 A140,140 0 0,1 -121.2,-70 Z" fill="#3498db"/>
      <path d="M0,0 L-121.2,-70 A140,140 0 0,1 0,-140 Z" fill="#9b59b6"/>
    </g>
    <circle r="52" fill="#fff" stroke="#d7ddd8"/>
  </g>
  <!-- palette sidebar -->
  <rect x="620" y="160" width="250" height="380" rx="12" fill="#f8faf8" stroke="#e2e8e4"/>
  <text x="644" y="198" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1d2a24">Current palette</text>
  <rect x="644" y="220" width="48" height="48" rx="8" fill="#e74c3c"/>
  <rect x="704" y="220" width="48" height="48" rx="8" fill="#3498db"/>
  <rect x="764" y="220" width="48" height="48" rx="8" fill="#f1c40f"/>
  <rect x="824" y="220" width="48" height="48" rx="8" fill="#2ecc71"/>
  <text x="644" y="310" font-family="Segoe UI, sans-serif" font-size="14" fill="#5f7268">UX: clear nav, persistent</text>
  <text x="644" y="332" font-family="Segoe UI, sans-serif" font-size="14" fill="#5f7268">palette, and progressive</text>
  <text x="644" y="354" font-family="Segoe UI, sans-serif" font-size="14" fill="#5f7268">disclosure across tools.</text>
</svg>
